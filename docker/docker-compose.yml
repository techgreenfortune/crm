name: crm
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    ports:
      - 3307:3306
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - 6379:6379

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/docker/init.sh
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - ..:/workspace
    ports:
      - 8000:8000 # Frappe web server
      - 9000:9000 # Socket.IO
      - 8080:8080 # Vite dev server (frontend HMR)

volumes:
  mariadb-data:
